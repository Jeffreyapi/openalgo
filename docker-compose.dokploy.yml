services:
  openalgo:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]

    expose:
      - "5000"
      - "8765"

    volumes:
      - openalgo_db:/app/db
      - openalgo_log:/app/log
      - openalgo_strategies:/app/strategies
      - openalgo_keys:/app/keys
      - openalgo_tmp:/app/tmp

    environment:
      HOST_SERVER: "https://openalgo.easytalents.fr"
      REDIRECT_URL: "https://openalgo.easytalents.fr/zerodha/callback"
      WEBSOCKET_URL: "wss://openalgo.easytalents.fr"

      BROKER_API_KEY: "${BROKER_API_KEY}"
      BROKER_API_SECRET: "${BROKER_API_SECRET}"

      APP_KEY: "${APP_KEY}"
      API_KEY_PEPPER: "${API_KEY_PEPPER}"
      FERNET_SALT: "${FERNET_SALT}"

      FLASK_ENV: "production"
      FLASK_DEBUG: "False"
      FLASK_HOST_IP: "0.0.0.0"
      FLASK_PORT: "5000"

      WEBSOCKET_HOST: "0.0.0.0"
      WEBSOCKET_PORT: "8765"
      WEBSOCKET_URL: "wss://openalgo.ton-domaine.com"

      TZ: "Africa/Abidjan"

volumes:
  openalgo_db:
  openalgo_log:
  openalgo_strategies:
  openalgo_keys:
  openalgo_tmp: